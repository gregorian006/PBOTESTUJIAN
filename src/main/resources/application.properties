# ==============================================================
# PLATFORM MENTORING AKADEMIK - Konfigurasi Aplikasi
# ==============================================================
# Deskripsi: File konfigurasi utama Spring Boot untuk sistem
#            mentoring akademik terintegrasi (Sekolah & Kampus).
# ==============================================================

spring.application.name=Platform Mentoring Akademik

# --- Konfigurasi Server ---
# Railway menyuntikkan port lewat env var $PORT secara otomatis.
# Fallback ke 8080 saat development lokal.
server.port=${PORT:8080}
# Wajib untuk Railway/proxy: agar Spring tahu base URL pakai https://
server.forward-headers-strategy=native

# --- Konfigurasi H2 Database (File-Based) ---
# CATATAN RAILWAY: Filesystem Railway bersifat ephemeral (terhapus tiap restart/redeploy).
# Artinya file H2 selalu mulai kosong → DataSeeder SELALU berjalan → data tiruan selalu ada.
# AUTO_SERVER=TRUE dihapus: fitur multi-process H2 tidak dibutuhkan di cloud single-container.
spring.datasource.url=jdbc:h2:file:./data/mentoring_akademik_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=mentorpbo2024

# H2 Console — aktifkan web-allow-others=true agar bisa diakses via Railway URL untuk debugging.
# PERHATIAN: nonaktifkan (false) jika sudah production / data sensitif.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- Konfigurasi JPA / Hibernate ---
# create-drop: buat ulang schema tiap startup — aman karena DB selalu kosong di Railway.
# Ganti ke "update" jika suatu saat memakai database persisten (PostgreSQL, dll).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

# DevTools: matikan di Railway (tidak relevan di cloud)
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false

# --- Konfigurasi Thymeleaf ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# Aktifkan cache di production untuk performa (nonaktifkan saat development lokal)
spring.thymeleaf.cache=true

# --- Konfigurasi Logging ---
# INFO lebih tepat untuk production; DEBUG terlalu verbose di Railway logs
logging.level.com.mentorpbo=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ==============================================================
# KONFIGURASI EMAIL (Gmail SMTP)
# Di Railway: set SPRING_MAIL_USERNAME dan SPRING_MAIL_PASSWORD
# sebagai Environment Variables di Railway Dashboard.
# ==============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:jejakilmu1@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.debug=false

# Email tujuan notifikasi admin
app.admin.email=${ADMIN_EMAIL:blesslysilaban@gmail.com}

# ==============================================================
# API.CO.ID — Data Sekolah & Universitas Indonesia
# Di Railway: set APP_API_COID_KEY sebagai Environment Variable.
# ==============================================================
app.api.coid.key=${APP_API_COID_KEY:Uwp6sB81fQBX8571QsqMpccvHc4SBjWuLUggHGuph3gcePEd3T}
app.api.coid.base-url=https://use.api.co.id

# ==============================================================
# KONFIGURASI GOOGLE OAUTH2 LOGIN
# Di Railway: set GOOGLE_CLIENT_ID dan GOOGLE_CLIENT_SECRET
# sebagai Environment Variables di Railway Dashboard.
#
# PENTING: Tambahkan Authorized Redirect URI di Google Console:
#   https://<nama-app>.up.railway.app/login/oauth2/code/google
# ==============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:PLACEHOLDER}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:PLACEHOLDER}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Set ke true HANYA setelah client-id dan client-secret diisi dengan nilai asli
app.google.oauth2.enabled=true
